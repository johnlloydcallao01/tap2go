packages:
  - "apps/*"
  - "packages/*"

# pnpm 11+ no longer reads the `pnpm` field in package.json or non-auth
# settings from .npmrc — project config must live here. The package.json
# `pnpm` block and .npmrc `node-linker` are kept for pnpm 9 local devs.
# Hostinger runs Corepack pnpm@11 under which pnpm cannot auto-switch to the
# pinned 9.12.3, so bypass that version check (hostinger-build.sh reinstalls
# deterministically with 9.12.3 via npx afterwards).
pmOnFail: ignore

# Preserve pnpm 9 behaviour: unlisted postinstall scripts warn, don't fail.
strictDepBuilds: false

# Hostinger's shared-host glibc is older than what @next/swc-linux-x64-gnu
# requires (GLIBC_2.29), so Next's native loader fails there. Installing the
# musl variant too (statically linked) gives Next a working fallback —
# without it the build dies with "Failed to load SWC binary for linux/x64".
supportedArchitectures:
  libc: [glibc, musl]

# Stop pnpm 10/11 from auto-spawning `pnpm install` before every `pnpm run`.
# On Hostinger the bare `pnpm` binary is not on PATH (pnpm only exists via a
# Corepack shim), so that pre-run check crashes the build with
# `spawnSync pnpm ENOENT`. Installs are run explicitly anyway.
verifyDepsBeforeRun: false

# Keep pnpm's 24-hour release-age protection. Expo SDK 58's pinned package
# versions and their exact new transitive releases below were published within
# that window when EAS resolved this lockfile; exempt only those versions.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@expo/fingerprint@0.21.7"
  - "@expo/metro-config@58.0.18"
  - "@expo/router-server@58.0.18"
  - "@noxcturnal/noxcturnal-darwin-arm64@0.1.10"
  - "@noxcturnal/noxcturnal-darwin-x64@0.1.10"
  - "@noxcturnal/noxcturnal-linux-arm64-gnu@0.1.10"
  - "@noxcturnal/noxcturnal-linux-arm64-musl@0.1.10"
  - "@noxcturnal/noxcturnal-linux-x64-gnu@0.1.10"
  - "@noxcturnal/noxcturnal-linux-x64-musl@0.1.10"
  - "@noxcturnal/noxcturnal-win32-arm64-msvc@0.1.10"
  - "@noxcturnal/noxcturnal-win32-x64-msvc@0.1.10"
  - "expo-dev-menu@58.0.12"
  - "expo-file-system@58.0.12"
  - "expo-modules-cli@0.3.3"
  - "expo-modules-jsi@58.0.20"
  - "expo-web-browser@58.0.7"
  - "expo@58.0.20"
  - "expo-dev-client@58.0.16"
  - "expo-router@58.0.27"
  - "@expo/cli@58.1.16"
  - "expo-dev-launcher@58.0.16"
  - "expo-modules-core@58.0.27"
  - "expo@58.0.21"
  - "expo-asset@58.0.19"
  - "expo-constants@58.0.14"
  - "expo-dev-client@58.0.17"
  - "expo-file-system@58.0.13"
  - "expo-font@58.0.11"
  - "expo-linking@58.0.15"
  - "expo-router@58.0.28"
  - "expo-splash-screen@58.0.12"
  - "expo-system-ui@58.0.7"
  - "@expo/cli@58.1.17"
  - "@expo/config-plugins@58.0.11"
  - "@expo/config@58.0.9"
  - "@expo/image-utils@0.12.6"
  - "@expo/inline-modules@0.2.8"
  - "@expo/local-build-cache-provider@58.0.9"
  - "@expo/metro-config@58.0.19"
  - "@expo/modules-macros-linux-arm64@0.27.1"
  - "@expo/modules-macros-linux-x64@0.27.1"
  - "@expo/modules-macros-win32-arm64@0.27.1"
  - "@expo/modules-macros-win32-x64@0.27.1"
  - "@expo/prebuild-config@58.0.17"
  - "@expo/require-utils@58.0.5"
  - "@expo/router-server@58.0.19"
  - "expo-dev-launcher@58.0.17"
  - "expo-modules-autolinking@58.0.16"
  - "expo-modules-cli@0.4.0"
  - "expo-modules-core@58.0.28"
  - "expo-modules-jsi@58.0.21"
  - "expo-modules-macros@0.27.1"
  - "node-forge@1.4.1"
  - "noxcturnal@0.1.10"

# Replaces `onlyBuiltDependencies` (removed in pnpm 11) from package.json.
allowBuilds:
  sharp: true
  esbuild: true
  unrs-resolver: true
  # Reviewed: no build needed (polyfill notice / optional DTrace bindings).
  core-js-pure: false
  dtrace-provider: false

# Replaces `.npmrc` node-linker (pnpm 11 ignores non-auth .npmrc settings).
nodeLinker: hoisted

# Mirrors `pnpm.overrides` in root package.json (pnpm 11 ignores that location).
overrides:
  "@react-native-async-storage/async-storage": "2.2.0"
  "@types/react": "~19.2.18"
  "mobile-customer>@types/react": "~19.3.0"
  "babel-preset-expo": "~57.0.13"
  "mobile-customer>babel-preset-expo": "~58.0.20"
  "baseline-browser-mapping": "2.11.18"
  "tailwindcss@<4": "3.3.2"
  "nativewind>tailwindcss": "3.3.2"
  "react": "19.3.0"
  "react-dom": "19.3.0"
  "react-native-worklets": "0.10.1"
  "mobile-customer>react-native-worklets": "0.13.0"

# Peer dependency configuration for React 19 compatibility
peerDependencyRules:
  allowedVersions:
    react: "19.x"
  ignoreMissing:
    - "@react-native-async-storage/async-storage"
